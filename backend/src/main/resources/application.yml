spring:
  application:
    name: trylog-backend
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hgkim_postgresql}?currentSchema=seoul_youth_ai_hackathon&connectTimeout=4"
    username: "${DB_USER:nerdcat822}"
    password: "${DB_PASSWORD}"
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

trylog:
  demo-date: ${TRYLOG_DEMO_DATE:}
  store-id: ${TRYLOG_STORE_ID:1}
  allow-writes: ${TRYLOG_ALLOW_WRITES:false}
  database-name: ${DB_NAME:hgkim_postgresql}
