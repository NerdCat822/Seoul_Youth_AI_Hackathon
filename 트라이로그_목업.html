:root{--bg:#eff3f9;--paper:#f9fbfe;--white:#fff;--ink:#18243a;--muted:#58677d;--blue:#245bd3;--light:#ebf2ff;--line:#dbe4f1;--good:#087165;--goodbg:#e5f5ef;--warn:#895416;--warnbg:#fff1d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,"Malgun Gothic",sans-serif;color:var(--ink);word-break:keep-all}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #2c71f4;outline-offset:3px}button:disabled{opacity:.5;cursor:default}h1,h2,h3,p{margin:0}a{color:var(--blue)}svg{flex:none;vertical-align:middle}
.workspace{max-width:1130px;margin:0 auto;padding:47px 30px;display:grid;grid-template-columns:minmax(260px,1fr) 446px;gap:80px;align-items:start}
.guide{padding-top:27px}.guide h1{font-size:43px;line-height:1.12;letter-spacing:-.06em;margin:14px 0}.guide>p{font-size:16px;color:var(--muted);line-height:1.65}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.03em;color:var(--blue)}.guide ol{padding-left:22px;margin:24px 0;color:var(--muted);line-height:1.65;font-size:15px}.guide li+li{margin-top:9px}.guide strong{color:var(--ink)}.guide-controls{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:9px}.guide-controls button{text-align:left}.guide small{display:block;color:var(--muted);margin-top:13px;line-height:1.55}.guide .date{color:var(--blue);font-weight:750}
.phone{position:relative;min-height:770px;border:1px solid var(--line);border-radius:30px;background:var(--paper);box-shadow:0 24px 55px #233b6a1a;overflow:hidden}.top{height:66px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 23px}.brand{font-size:26px;letter-spacing:-.085em;color:var(--blue);font-weight:850}.top button{background:none;border:0;padding:8px 0;min-height:44px}.store{font-size:13px;color:var(--muted);font-weight:650}.screen{padding:24px 23px 28px}.screen h2{font-size:29px;letter-spacing:-.055em;line-height:1.24;margin:7px 0 10px}.screen .lede{font-size:15px;color:var(--muted);line-height:1.58;margin-bottom:19px}.label{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.02em}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin:13px 0}.card.lead{background:var(--light);border-color:#cbdcfa}.card h3{font-size:20px;line-height:1.3;letter-spacing:-.035em;margin:6px 0}.card p,.card li{font-size:14px;color:var(--muted);line-height:1.58}.card p+p{margin-top:7px}.card .tiny,.tiny{font-size:12px;color:var(--muted);line-height:1.52}.tag{display:inline-block;border-radius:30px;padding:5px 8px;background:#edf2fa;color:#43536b;font-size:11px;font-weight:750}.tag.ok{color:var(--good);background:var(--goodbg)}
.primary,.secondary,.quiet,.icon{border:0;border-radius:12px;font-weight:750;min-height:44px}.primary{width:100%;background:var(--blue);color:#fff;padding:12px 15px;font-size:16px}.secondary{background:#fff;border:1px solid var(--line);padding:9px 13px;font-size:14px}.quiet{background:transparent;color:var(--blue);padding:8px 1px;font-size:14px}.action{margin-top:13px}.option{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;min-height:46px;padding:10px 12px;font-weight:650}.option+.option{margin-top:7px}.option[aria-pressed=true]{background:var(--light);border-color:var(--blue);color:var(--blue)}.option span{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}
.compose{display:flex;gap:8px;align-items:center;background:white;border:1px solid var(--line);border-radius:15px;padding:6px;margin-top:12px}.compose input{flex:1;width:0;border:0;background:transparent;outline:0!important;padding:9px 5px;min-height:42px;font-size:14px;color:var(--ink)}.icon{padding:0 10px;background:var(--light);color:var(--blue)}.compose .send{background:#e9edf4;color:var(--ink);font-size:13px}.compose .listening{background:var(--blue);color:#fff}.voice-status{min-height:0;color:var(--muted);font-size:12px;line-height:1.4;margin:7px 1px 0}.record-line{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}.record-line:last-child{border-bottom:0}.record-line small{display:block;color:var(--muted);margin-top:3px}.record-line button{min-width:64px}.list-title{font-size:15px;margin-top:21px}
.meta{margin:0;display:grid;gap:11px}.meta div{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:14px}.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:730}.help{border-radius:11px;background:var(--warnbg);color:var(--warn);font-size:13px;line-height:1.55;padding:11px 12px;margin-top:12px}.summary{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}.bubble{background:#edf2fa;border-radius:13px 13px 3px 13px;margin:0 0 16px 22px;padding:11px 13px;font-size:14px;line-height:1.55}.sheet{margin-top:11px}.sheet summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:14px;padding:10px 0}.sheet p{font-size:13px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}.metric{border-radius:11px;padding:11px;background:#f2f5fb}.metric span{display:block;font-size:12px;color:var(--muted)}.metric b{display:block;font-size:22px;letter-spacing:-.05em;margin-top:5px}.say{border-top:1px solid var(--line);padding-top:11px;margin-top:12px}.mobile-tools{display:none}
@media(max-width:760px){.workspace{display:block;max-width:475px;padding:0}.guide{display:none}.phone{border:0;border-radius:0;min-height:100dvh;box-shadow:none}.mobile-tools{display:block;margin-top:20px}.mobile-tools summary{font-size:13px;color:var(--muted);cursor:pointer}.mobile-tools .guide-controls{margin-top:8px}}

.phone{display:flex;flex-direction:column}.phone #app{flex:1}.app-nav{position:sticky;bottom:0;z-index:3;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:5px 18px max(5px,env(safe-area-inset-bottom))}.app-nav[hidden]{display:none}.nav-btn{border:0;background:transparent;display:grid;justify-items:center;align-content:center;gap:2px;min-height:54px;font-size:12px;font-weight:700;color:var(--muted)}.nav-btn[aria-current="page"]{color:var(--blue)}.nav-btn svg{width:22px;height:22px}

function compute(r){
 const n=diff(r.start,r.end)+1;if(n<=0||n%7!==0)return null;
 const b1=shift(r.start,-n),b2=shift(r.start,-1),a1=r.start,a2=r.end;
 const rows=demoRows(), ag=(lo,hi)=>rows.filter(x=>x.day>=lo&&x.day<=hi).reduce((t,x)=>({days:t.days+1,orders:t.orders+x.orders,sets:t.sets+x.sets}),{days:0,orders:0,sets:0});
 const before=ag(b1,b2),after=ag(a1,a2);
 if(before.days!==n||after.days!==n||!before.orders||!after.orders)return null;
 return {before,after,b1,b2,a1,a2,prev:before.sets/before.orders*100,now:after.sets/after.orders*100};
}

function neighborhoodCounts(item){
 const counts=[0,0,0];
 for(const [before,after] of item.pairs){
  const difference=after-before;
  const limit=item.unit==='%'?2:before*5/100;
  counts[difference>limit?0:difference< -limit?2:1]++;
 }
 return counts;
}

function playDetailMotion(){

  if(!entries.some(entry=>entry.isIntersecting))return;

 const complete=db.records.filter(r=>r.closed).length;
 const due=db.records.filter(r=>!r.closed&&db.today>=r.check).length;
 const tiles=[['남긴 시도',db.records.length],['확인할 차례',due],['결과 확인',complete]];
 const summary='<div class="stats-summary">'+tiles.map(([label,count])=>'<div><strong>'+count+'</strong><span>'+label+'</span></div>').join('')+'</div>';
 if(!db.records.length)return summary+'<div class="stats-card"><h3>아직 남긴 시도가 없어요</h3><p class="stats-note">메뉴판이나 가격처럼 가게에서 바꾼 일을 남기면 여기서 결과까지 볼 수 있어요.</p>'+btn('home','홈에서 시도 남기기')+'</div><div class="stats-card stats-example">'+illustration('menu')+'<span class="stats-kicker">시연 예시</span><h3>점심 세트 추천 표시</h3><p class="stats-note">결과가 어떻게 보이는지 가상 자료로 확인해 보세요.</p>'+btn('sampleResult','결과 예시 보기','secondary')+'</div>';
 return summary+'<h3 class="list-title">내가 해본 일</h3>'+db.records.map(r=>{
  const v=r.closed?compute(r):null;
  const ready=!r.closed&&db.today>=r.check;
  const status=r.closed?'결과 확인 완료':ready?'확인할 차례':'진행 중';
  const detail=v?'점심 세트 주문 '+v.before.sets+'건 → '+v.after.sets+'건':ready?'판매 자료를 넣으면 결과를 확인할 수 있어요.':pretty(r.check)+'에 확인할 예정이에요.';
  return '<article class="stats-card"><span class="stats-kicker">'+status+(v?' · 가상 판매 자료':'')+'</span><h3>'+esc(r.name)+'</h3><p class="stats-note">'+detail+'</p>'+(v?'<p class="stats-note">세트를 고른 비중 '+percent(v.prev)+' → 약 '+percent(v.now)+'</p>':'')+btn('open',r.closed?'결과 보기':ready?'결과 확인하기':'시도 보기','secondary','data-id="'+esc(r.id)+'"')+'</article>';
 }).join('');
}
function stats(){
 const tabs=[['mine','내 가게'],['nearby','동네 가게']];
 if(zeroOnly&&statsView==='nearby')return '<div class="screen stats-view"><h2>0원으로 해볼 일</h2>'+neighborhood()+'</div>';
 return '<div class="screen stats-view"><h2>장사 기록</h2><p class="lede">내가 해본 일과 동네 사례를 한곳에서 봐요.</p><div class="stats-switch" role="group" aria-label="장사 기록 보기">'+tabs.map(([id,label])=>btn('statsView',label,'stats-tab','data-view="'+id+'" aria-pressed="'+(statsView===id)+'"')).join('')+'</div>'+(statsView==='mine'?myStats():neighborhood())+'</div>';
}
function render(){
 detailObserver?.disconnect();
 back.hidden=navigationDepth===0;
 history.replaceState({...history.state,...navigationState()},'');
 app.innerHTML=page==='home'?home():page==='calendar'?calendar():page==='stats'?stats():page==='nearbyDetail'?nearbyDetail():page==='mlPreview'?mlPreview():page==='stockPreview'?stockPreview():page==='talk'?talk():result();
 nav.hidden=!['home','calendar','stats'].includes(page);
 nav.innerHTML=btn('home',navIcons.home+'<span>홈</span>','nav-btn',page==='home'?'aria-current="page"':'')+
  btn('calendar',navIcons.calendar+'<span>달력</span>','nav-btn',page==='calendar'?'aria-current="page"':'')+
  btn('stats',navIcons.stats+'<span>장사 기록</span>','nav-btn',page==='stats'?'aria-current="page"':'');

}
function feedback(s){msg=s;const node=document.querySelector('#voice-status');if(node)node.textContent=s;}
function startA(){said=demoPhrase;draft=makeDraft(options[0].name,said);setStage('draft');}
function startB(){said='요즘 화요일 점심이 한산해. 할인 말고 뭐 해볼까?';selected=null;setStage('ideas');}
function save(){if(!draft)return;const r={...draft,id:String(Date.now()),closed:false};db.records.unshift(r);persist();draft=null;said='';go('home');feedback(pretty(r.check)+'에 확인할 일로 저장했어요.');}
function changeEnd(value){if(value<draft.start){feedback('끝나는 날이 시작일보다 빨라요. 날짜를 다시 말해주세요.');return;}draft.end=value;draft.check=shift(value,1);draft.endReason='말씀하신 기간으로 바꿨어요.';render();}
function submit(value){
 const t=value.trim();if(!t)return;
 if(page==='talk'&&stage==='draft'){
  if(/저장|좋아요|^응[.!]?$/.test(t)){save();return;}
  if(/일주일 더|한 주 더|7일 더/.test(t)){changeEnd(shift(draft.end,7));return;}
  if(/금요일까지만/.test(t)){const day=date(draft.end).getUTCDay();changeEnd(shift(draft.end,-((day+2)%7)));return;}
  if(t.includes('까지')&&explicit(t)){changeEnd(explicit(t));return;}
 }
 if(page==='talk'&&stage==='record'&&/일주일 더|한 주 더|7일 더/.test(t)){
  active.end=shift(active.end,7);active.check=shift(active.end,1);persist();render();feedback(pretty(active.check)+'에 확인하도록 바꿨어요.');return;
 }
 if(page==='talk'&&stage==='ideas'&&/추천 표시|구성|설명/.test(t)&&/해볼|할게|좋아/.test(t)){
  selected=t.includes('추천 표시')?'badge':'copy';choose();return;
 }
 said=t;
 if(/한산|손님.*없|주문.*줄|뭐.*해볼|추천해/.test(t)&&!/붙였|붙일 거/.test(t)){selected=null;setStage('ideas');return;}
 if(/점심 세트|런치 세트/.test(t)&&/추천|표시|메뉴판|설명|구성/.test(t)){
  draft=makeDraft(/설명|구성/.test(t)?options[1].name:options[0].name,t);setStage('draft');return;
 }
 feedback('이 시안은 점심 세트 변경과 점심 주문 고민을 처리해요. 위 예시로 이어가 볼까요?');
}
function choose(){const o=options.find(x=>x.id===selected);if(!o)return;draft=makeDraft(o.name,'오늘부터');setStage('draft');}
function voice(){
 if(listening){recognition?.stop();return;}
 const Voice=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Voice){feedback('이 브라우저에서 말하기를 시작할 수 없어요. 바로 옆에 글로 적어주세요.');document.querySelector('#utterance')?.focus();return;}
 const rec=new Voice();recognition=rec;rec.lang='ko-KR';rec.interimResults=false;rec.maxAlternatives=1;
 const toggle=on=>{const b=document.querySelector('[data-do="voice"]');if(b){b.classList.toggle('listening',on);b.setAttribute('aria-label',on?'말하기 중지':'말하기');}};
 rec.onstart=()=>{listening=true;toggle(true);feedback('듣고 있어요. 평소 말투로 이야기해주세요.');};
 rec.onresult=e=>{const s=e.results[0][0].transcript;const input=document.querySelector('#utterance');if(input)input.value=s;feedback('이렇게 들었어요. 확인하고 보내주세요.');};
 rec.onerror=()=>{feedback('말을 잘 듣지 못했어요. 같은 곳에 글로 이어갈 수 있어요.');document.querySelector('#utterance')?.focus();};
 rec.onend=()=>{if(recognition===rec){recognition=null;listening=false;toggle(false);}};
 try{rec.start();}catch{recognition=null;feedback('말하기를 시작할 수 없어요. 글로 입력해주세요.');}
}
document.addEventListener('submit',e=>{if(e.target.id==='compose'){e.preventDefault();const input=document.querySelector('#utterance');submit(input.value);}});
document.addEventListener('change',e=>{
 const input=e.target;
 if(input.id!=='sales-photo'&&input.id!=='sales-file')return;
 const file=input.files?.[0];
 if(!file)return;
 const status=document.querySelector('#upload-status');
 const valid=input.id==='sales-photo'?(file.type.startsWith('image/')||/\.(jpe?g|png|webp|heic|heif|gif|bmp|tiff?)$/i.test(file.name)):/\.xlsx?$/i.test(file.name);
 if(!valid){input.value='';status.textContent='사진이나 엑셀 형식의 파일을 다시 골라주세요.';return;}
 const other=document.querySelector(input.id==='sales-photo'?'#sales-file':'#sales-photo');
 other.value='';
 status.innerHTML='<strong>'+esc(file.name)+'</strong><p>파일을 선택했어요. 이 목업은 첨부 화면까지 지원해요. 비교 결과는 아래 가상 자료로 볼 수 있어요.</p>';
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-do]');if(!b||b.disabled)return;
 switch(b.dataset.do){
  case 'back':if(navigationDepth)history.back();break;
  case 'home':said='';go('home');break;
  case 'calendar':openCalendar();break;
  case 'stats':zeroOnly=false;go('stats');break;
  case 'nearby':zeroOnly=false;statsView='nearby';go('stats');break;
  case 'zeroIdeas':zeroOnly=true;statsView='nearby';go('stats');break;
  case 'toggleHomeInput':{
   homeInputOpen=!homeInputOpen;
   const panel=document.querySelector('#home-input-panel');
   panel.hidden=!homeInputOpen;
   b.setAttribute('aria-expanded',String(homeInputOpen));
   b.querySelector('.input-arrow').textContent=homeInputOpen?'⌃':'›';
   history.replaceState({...history.state,...navigationState()},'');
   if(homeInputOpen)document.querySelector('#utterance')?.focus();
   break;
  }
  case 'nearbyFilter':updateNearbyFilter(b,'category');break;
  case 'difficultyFilter':updateNearbyFilter(b,'difficulty');break;
  case 'nearbyDetail':nearbyCase=b.dataset.case;go('nearbyDetail');break;
  case 'statsView':statsView=b.dataset.view;render();document.querySelector('[data-view="'+statsView+'"]')?.focus();break;
  case 'calendarToday':openCalendar();break;
  case 'monthPrev':moveMonth(-1);break;
  case 'monthNext':moveMonth(1);break;
  case 'day':calendarDay=b.dataset.day;render();document.querySelector('[data-day="'+calendarDay+'"]')?.focus();break;
  case 'sampleTask':db.sampleTaskDone=!db.sampleTaskDone;persist();render();break;
  case 'sampleResult':active=sampleTrial();go('result');break;
  case 'sampleA':startA();break;case 'sampleB':startB();break;
  case 'pick':selected=b.dataset.id;render();document.querySelector('[data-id="'+selected+'"][aria-pressed]')?.focus();break;
  case 'choose':choose();break;case 'save':save();break;case 'voice':voice();break;
  case 'open':active=db.records.find(r=>r.id===b.dataset.id);if(!active)return;said='';if(active.closed)go('result');else setStage(db.today>=active.check?'data':'record');break;
  case 'pickSalesPhoto':document.querySelector('#sales-photo')?.click();break;
  case 'pickSalesFile':document.querySelector('#sales-file')?.click();break;
  case 'load':setStage('review');break;
  case 'calculate':if(compute(active)){active.closed=true;persist();}go('result');break;
  case 'nextTrial':said='다음엔 뭘 해볼까요?';draft=makeDraft(active.name===options[1].name?'점심 세트 사진을 더 잘 보이게 두기':options[1].name,'오늘부터');setStage('draft');break;
  case 'mlPreview':go('mlPreview');break;
  case 'stockPreview':go('stockPreview');break;
  case 'speak':{const v=compute(active);if(!v)return;if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){feedback('읽어주기는 이 브라우저에서 사용할 수 없어요.');return;}const u=new SpeechSynthesisUtterance('점심 세트가 들어간 주문은 '+v.before.sets+'건에서 '+v.after.sets+'건으로 늘었어요. 하지만 주문 중 비중은 '+Math.round(v.prev)+'퍼센트에서 약 '+Math.round(v.now)+'퍼센트로 줄었어요.');u.lang='ko-KR';u.onerror=()=>feedback('읽어주기를 시작할 수 없어요. 화면에서 결과를 확인해주세요.');speechSynthesis.cancel();speechSynthesis.speak(u);break;}
  case 'jump':{const pending=db.records.find(r=>!r.closed&&db.today<r.check);if(!pending){feedback('먼저 시도 하나를 저장해주세요.');return;}db.today=pending.check;persist();said='';go('home');break;}
  case 'reset':playedWelcome=false;homeInputOpen=false;zeroOnly=false;db=blank();persist();active=null;draft=null;said='';go('home');break;
 }
});
render();
</script></body></html>
