# trylog-web: 화면(정적 파일)을 내주고 /api/ 를 Spring(trylog-api:7000)으로 넘긴다.
# nginx-gateway가 /try-log/ 프리픽스를 떼고 이 서버로 보낸다.
server {
    listen 80;
    # Docker 내부 DNS. api 컨테이너가 다시 만들어져 주소가 바뀌어도 따라간다.
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 에이전트 서버(trylog-agent:7500). 화면 오른쪽 대화창이 /api/v1/agent/chat 을 부른다.
    # 에이전트는 로그인한 가게의 요청만 받는다(TRYLOG_REQUIRE_LOGIN=1). 로그인 쿠키와 CSRF 토큰은
    # 요청 머리글 그대로 넘어가고, 에이전트가 그것으로 Spring 에 세션을 확인한다.
    # 예측 경로(/api/v1/ml/)는 화면에서 쓰지 않아 열지 않았다.
    location /api/v1/agent/ {
        # 음성 입력(/api/v1/agent/stt)의 녹음 파일. 에이전트가 5MB 까지 받는다. 기본 1m 이면 413.
        client_max_body_size 6m;
        set $trylog_agent trylog-agent;
        proxy_pass http://$trylog_agent:7500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        # 주문 파일(CSV·XLSX) 업로드는 Spring에서 5MB까지 받는다.
        client_max_body_size 6m;
        set $trylog_api trylog-api;
        proxy_pass http://$trylog_api:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 파일 이름에 해시가 붙어 있어 오래 캐시해도 된다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 화면 이동은 주소의 # 뒤(hash)로 하므로 index.html 하나만 있으면 된다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
