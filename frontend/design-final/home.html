<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 가게 홈 · trylog</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-nav="home" data-ai="open">
  <header data-topbar></header>

  <div class="px-14 pb-16 pt-8">
    <main class="mx-auto w-full max-w-container min-w-0">
      <!-- 인사 -->
      <div class="flex items-center justify-between gap-6">
        <div>
          <h1 class="page-title"><span class="text-brand">행복분식</span> 사장님, 안녕하세요</h1>
          <p class="mt-1 text-base text-sub" data-greet></p>
        </div>
        <a href="ai.html?start=record" class="btn btn-xl btn-primary flex-none">새 기록 작성하기</a>
      </div>

      <!-- 이번 주 -->
      <section class="card mt-10 px-5 pb-5 pt-6" aria-labelledby="h-week">
        <div class="flex items-start justify-between">
          <div><h2 id="h-week" class="text-base font-bold">이번 주</h2>
            <p class="mt-1 text-[13px] text-sub">11월 29일(일) ~ 12월 5일(토)</p></div>
          <a href="calendar.html" class="more-link">자세히 보기 <span data-icon="chevron-right" data-size="16"></span></a>
        </div>
        <div class="relative mt-4">
          <div class="pointer-events-none absolute inset-0 grid grid-cols-7" aria-hidden="true" data-week-cols></div>
          <div class="relative grid grid-cols-7" data-week-head></div>
          <div class="relative mt-2 grid grid-cols-7 gap-y-1.5 pb-1" data-week-lanes></div>
        </div>
      </section>

      <!-- 기록 요약 -->
      <section class="card mt-14 grid grid-cols-4 px-8 py-7" aria-label="기록 요약" data-summary></section>

      <!-- 진행 중인 기록 -->
      <section class="mt-16" aria-labelledby="h-active">
        <div class="flex items-center justify-between"><h2 id="h-active" class="text-[18px] font-bold">진행 중인 기록</h2>
          <a href="records.html" class="more-link">모든 기록 보기 <span data-icon="chevron-right" data-size="16"></span></a></div>
        <div class="mt-5 flex flex-wrap gap-1" role="tablist" aria-label="분야" data-rec-tabs></div>
        <div class="mt-5 grid grid-cols-2 gap-8 max-[1023px]:grid-cols-1" data-active-records></div>
      </section>

      <!-- 동네 사례 -->
      <section class="mt-16" aria-labelledby="h-ideas">
        <div class="flex items-center justify-between"><h2 id="h-ideas" class="text-[18px] font-bold">동네 가게들은 뭘 해봤을까?</h2>
          <a href="explore.html" class="more-link">모든 동네 사례 보기 <span data-icon="chevron-right" data-size="16"></span></a></div>
        <div class="mt-5 grid grid-cols-3 gap-4" data-ideas></div>
      </section>
    </main>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/ai-chat.js"></script>
  <script>
    const { $, esc, icon, ideaCard } = App;
    const D = TRYLOG;
    const count = s => D.records.filter(r => r.status === s).length;

    $('[data-greet]').textContent = `결과를 확인할 기록이 ${count('check')}건 있어요.`;
    $('[data-summary]').innerHTML = [['진행 중', count('progress'), 'progress'], ['결과 확인 필요', count('check'), 'check'],
      ['확인 완료', count('done'), 'done'], ['전체 기록', D.records.length, 'all']].map(([l, n, s], i) =>
      `<a href="records.html?status=${s}" class="group block ${i ? 'border-l border-line-light pl-8' : ''}">
        <p class="text-sm font-medium text-sub">${l}</p>
        <p class="mt-2 text-2xl font-bold text-brand-strong group-hover:underline">${n}건</p></a>`).join('');

    // ---------- 이번 주 (11/29 일 ~ 12/5 토) ----------
    const WEEK = ['2026-11-29', '2026-11-30', '2026-12-01', '2026-12-02', '2026-12-03', '2026-12-04', '2026-12-05'];
    const WX = [['cloud', '흐림'], ['sun', '맑음'], ['sun', '맑음'], ['sun', '맑음'], ['cloud', '흐림'], ['rain', '비'], ['cloud', '흐림']];
    const TODAY_I = WEEK.indexOf(D.today);
    const color = { r1: '#155dfc', r2: '#e17100', r3: '#00b8db', r4: '#ad46ff' };
    const span = { r1: ['2026-11-19', '2026-12-02', '2026-12-03'], r2: ['2026-11-24', '2026-12-07', '2026-12-08'],
      r3: ['2026-11-30', '2026-12-13', '2026-12-14'], r4: ['2026-12-08', '2026-12-21', '2026-12-22'] };
    $('[data-week-cols]').innerHTML = WEEK.map((k, i) => `<span class="${i ? 'border-l border-line-light' : ''} ${i === TODAY_I ? 'rounded-xl bg-brand-weak/60' : ''}"></span>`).join('');
    $('[data-week-head]').innerHTML = WEEK.map((k, i) => {
      const d = +k.slice(8), today = i === TODAY_I;
      return `<div class="flex items-center justify-between px-3 py-2">
        <span class="flex items-center gap-2"><span class="inline-flex h-6 min-w-[24px] items-center justify-center rounded-full text-[13px] font-semibold ${today ? 'bg-brand px-1 text-white' : 'text-body'}">${d}</span>
          <span class="text-[13px] ${today ? 'font-medium text-brand-text' : 'text-dim'}">${'일월화수목금토'[i]}</span></span>
        <span class="text-dim" title="${WX[i][1]}" aria-label="날씨 ${WX[i][1]}">${icon(WX[i][0], 16)}</span></div>`;
    }).join('');
    // 진행 기간 막대와 결과 확인 표시를 줄(lane)에 겹치지 않게 채워 넣음
    const items = [];
    D.records.forEach(r => {
      const s = span[r.id]; if (!s) return;
      if (s[0] <= WEEK[6] && s[1] >= WEEK[0]) {
        const a = WEEK.findIndex(k => k >= s[0]), b = WEEK.findLastIndex(k => k <= s[1]);
        items.push({ r, kind: 'bar', a: a < 0 ? 0 : a, b, more: s[1] > WEEK[6] });
      }
      const ri = WEEK.indexOf(s[2]);
      if (ri > -1) items.push({ r, kind: 'pill', a: ri, b: ri });
    });
    items.sort((x, y) => x.a - y.a || (x.kind === 'pill') - (y.kind === 'pill'));
    const laneEnd = [];
    items.forEach(it => {
      let l = laneEnd.findIndex(e => e < it.a);
      if (l < 0) { l = laneEnd.length; laneEnd.push(-1); }
      laneEnd[l] = it.b; it.lane = l;
    });
    $('[data-week-lanes]').innerHTML = items.map(({ r, kind, a, b, more, lane }) => kind === 'bar'
      ? `<a href="record.html?id=${r.id}" class="mx-1 flex h-7 min-w-0 items-center gap-1.5 rounded-md px-2 text-[13px] font-medium text-body hover:brightness-95"
          style="grid-column:${a + 1} / ${b + 2};grid-row:${lane + 1};background:${color[r.id]}1f" title="${esc(r.title)} · ${r.start} ~ ${r.end}">
          <i class="h-1.5 w-1.5 flex-none rounded-full" style="background:${color[r.id]}"></i><span class="truncate">${esc(r.title)}</span>
          ${more ? `<span class="ml-auto flex-none" style="color:${color[r.id]}" aria-label="다음 주로 이어짐">${icon('chevron-right', 16)}</span>` : ''}</a>`
      : `<a href="${r.status === 'check' ? 'result.html' : 'record.html?id=' + r.id}" class="mx-1 flex h-7 min-w-0 items-center gap-1 rounded-md bg-brand px-2 text-[13px] font-semibold text-white hover:bg-brand-strong"
          style="grid-column:${a + 1} / ${b + 2};grid-row:${lane + 1}">${icon('check', 14)}<span class="truncate">결과 확인 · ${esc(r.title.split(' ')[0])}</span></a>`).join('');

    // ---------- 진행 중인 기록 (분야 필터 + 2열 카드) ----------
    const active = D.records.filter(r => ['check', 'progress', 'planned'].includes(r.status));
    const dday = r => { const n = Math.round((new Date(2026, 11, r.resultDay) - new Date(2026, 11, 3)) / 864e5); return n <= 0 ? 'D-Day' : `D-${n}`; };
    const field = (label, val, i) => `<div class="min-w-0 ${i ? 'border-l border-line-light pl-4' : ''}"><dt class="text-[13px] text-sub">${label}</dt><dd class="mt-1 truncate text-[15px] font-medium text-body">${val}</dd></div>`;
    let cat = 'all';
    const TABS = [['all', '전체'], ['menu', '메뉴·가격'], ['store', '매장 운영'], ['delivery', '배달·홍보']];
    function renderRecords() {
      $('[data-rec-tabs]').innerHTML = TABS.map(([k, l]) => `<button type="button" role="tab" class="filter-tab" aria-selected="${cat === k}" data-rec-cat="${k}">${l} <span class="count">${active.filter(r => k === 'all' || r.cat === k).length}</span></button>`).join('');
      const list = active.filter(r => cat === 'all' || r.cat === cat);
      $('[data-active-records]').innerHTML = list.map(r => {
        const hot = r.status === 'check', c = D.categories[r.cat];
        return `<a href="${hot ? 'result.html?id=' + r.id : 'record.html?id=' + r.id}" class="group block rounded-card bg-white px-5 py-6 transition-shadow hover:shadow-panel ${hot ? 'border-2 border-brand/50 shadow-panel' : 'border border-line-light'}">
          <span class="cat ${c.cls}">${c.label}</span>
          <div class="mt-4 flex items-center justify-between gap-3">
            <h3 class="flex min-w-0 items-center gap-2.5 text-[18px] font-semibold"><span class="flex-none text-brand">${dday(r)}</span><span class="truncate">${esc(r.title)}</span>
              <span class="flex-none text-sub group-hover:text-heading">${icon('chevron-right', 20)}</span></h3>
            ${hot ? '<span class="badge flex-none bg-[#fff1f2] text-up">확인 필요</span>' : `<span class="badge flex-none ${D.statusClass[r.status]}">${D.statusLabel[r.status]}</span>`}</div>
          <dl class="mt-4 grid grid-cols-3 gap-4">${field('시작일', r.start, 0)}${field('종료일', r.end, 1)}${field('결과 확인일', r.result, 2)}</dl>
          <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-surface" role="progressbar" aria-label="진행률" aria-valuenow="${r.progress}" aria-valuemin="0" aria-valuemax="100"><div class="h-full rounded-full bg-brand" style="width:${r.progress}%"></div></div>
          <div class="divider my-5"></div>
          ${hot ? `<p class="text-[15px] font-medium text-danger">${esc(r.warn)}</p>` : `<p class="text-[15px] text-sub">${esc(r.compare)}를 비교해요</p>`}
        </a>`; }).join('') || '<p class="col-span-full rounded-card border border-line-light py-10 text-center text-[15px] text-sub">이 분야에서 진행 중인 기록이 없어요.</p>';
    }
    $('[data-rec-tabs]').addEventListener('click', e => { const t = e.target.closest('[data-rec-cat]'); if (t) { cat = t.dataset.recCat; renderRecords(); } });
    renderRecords();

    $('[data-ideas]').innerHTML = ['i1', 'i2', 'i3'].map(id => ideaCard(D.ideas.find(i => i.id === id))).join('');
    App.hydrateIcons();
  </script>
</body>
</html>
