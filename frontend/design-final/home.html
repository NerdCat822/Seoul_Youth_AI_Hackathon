<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 가게 홈 · trylog</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-nav="home" data-ai="open">
  <header data-topbar></header>

  <div class="px-14 pb-16 pt-8">
    <main class="mx-auto w-full max-w-container min-w-0">
      <!-- 인사 -->
      <div class="flex items-center justify-between gap-6">
        <div>
          <h1 class="page-title"><span class="text-brand">행복분식</span> 사장님, 안녕하세요</h1>
          <p class="mt-1 text-base text-sub" data-greet></p>
        </div>
        <a href="ai.html?start=record" class="btn btn-xl btn-primary flex-none">새 기록 작성하기</a>
      </div>

      <!-- 진행 중인 기록 + 달력 -->
      <div class="mt-10 flex items-start gap-10">
        <section class="min-w-0 flex-1" aria-labelledby="h-active">
          <div class="flex items-center justify-between"><h2 id="h-active" class="text-[18px] font-bold">진행 중인 기록</h2>
            <a href="records.html" class="more-link">모든 기록 보기 <span data-icon="chevron-right" data-size="16"></span></a></div>
          <div class="mt-4 space-y-6" data-active-records></div>
        </section>
        <section class="panel w-[380px] flex-none p-6 max-[1599px]:[body.ai-open_&]:hidden" aria-label="이번 달 달력">
          <h2 class="text-[18px] font-bold"><a href="calendar.html" class="hover:underline">2026년 12월</a></h2>
          <div class="mt-4 grid grid-cols-7 text-center text-[13px] text-sub" data-mini-week></div>
          <div class="grid grid-cols-7 text-center" data-mini-cal></div>
          <div class="divider mt-3"></div>
          <ul class="mt-4 space-y-2 text-sm text-body" data-mini-legend></ul>
        </section>
      </div>

      <!-- 기록 요약 -->
      <section class="card mt-14 grid grid-cols-4 px-8 py-7" aria-label="기록 요약" data-summary></section>

      <!-- 동네 사례 -->
      <section class="mt-16" aria-labelledby="h-ideas">
        <div class="flex items-center justify-between"><h2 id="h-ideas" class="text-[18px] font-bold">동네 가게들은 뭘 해봤을까?</h2>
          <a href="explore.html" class="more-link">모든 동네 사례 보기 <span data-icon="chevron-right" data-size="16"></span></a></div>
        <div class="mt-5 grid grid-cols-3 gap-4" data-ideas></div>
      </section>
    </main>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/ai-chat.js"></script>
  <script>
    const { $, esc, ideaCard } = App;
    const D = TRYLOG;
    const count = s => D.records.filter(r => r.status === s).length;

    $('[data-greet]').textContent = `결과를 확인할 기록이 ${count('check')}건 있어요.`;
    $('[data-summary]').innerHTML = [['진행 중', count('progress'), 'progress'], ['결과 확인 필요', count('check'), 'check'],
      ['확인 완료', count('done'), 'done'], ['전체 기록', D.records.length, 'all']].map(([l, n, s], i) =>
      `<a href="records.html?status=${s}" class="group block ${i ? 'border-l border-line-light pl-8' : ''}">
        <p class="text-sm font-medium text-sub">${l}</p>
        <p class="mt-2 text-2xl font-bold text-brand-strong group-hover:underline">${n}건</p></a>`).join('');

    // 진행 중인 기록 카드 — 항목 사이 세로 구분선, 확인 필요는 강조 테두리 + 경고 문구
    const active = D.records.filter(r => ['check', 'progress'].includes(r.status));
    const field = (label, val, i) => `<div class="min-w-0 ${i ? 'border-l border-line-light pl-4' : ''}"><dt class="text-[13px] text-sub">${label}</dt><dd class="mt-1 truncate text-[15px] font-medium text-body">${val}</dd></div>`;
    $('[data-active-records]').innerHTML = active.map(r => {
      const hot = r.status === 'check';
      const when = hot ? '오늘' : r.resultNote.replace('D-', '') + '일 뒤';
      return `<a href="${hot ? 'result.html?id=' + r.id : 'record.html?id=' + r.id}" class="block rounded-card bg-white px-5 py-6 transition-shadow hover:shadow-panel ${hot ? 'border-2 border-brand/50 shadow-panel' : 'border border-line-light'}">
        <div class="flex items-center justify-between gap-3"><h3 class="text-[18px] font-semibold">${esc(r.title)}</h3>
          ${hot ? '<span class="badge bg-[#fff1f2] text-up">확인 필요</span>' : '<span class="badge badge-progress">진행 중</span>'}</div>
        <dl class="mt-4 grid grid-cols-4 gap-4">
          ${field('시작일', r.start, 0)}${field('종료일', r.end, 1)}
          ${field('결과 확인일', `${r.result} <span class="ml-1 text-[13px] font-semibold text-brand">${when}</span>`, 2)}${field('비교 항목', esc(r.compare), 3)}
        </dl>
        <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-surface" role="progressbar" aria-label="진행률" aria-valuenow="${r.progress}" aria-valuemin="0" aria-valuemax="100"><div class="h-full rounded-full bg-brand" style="width:${r.progress}%"></div></div>
        ${hot ? `<div class="divider my-5"></div><p class="text-[15px] font-medium text-danger">${esc(r.warn)}</p>` : ''}
      </a>`; }).join('');

    // 미니 달력 (2026년 12월, 1일 = 화요일)
    const colors = { r2: '#155dfc', r3: '#00b8db', r4: '#ad46ff' };
    const spans = { r2: [1, 7], r3: [1, 13], r4: [8, 21] };
    $('[data-mini-week]').innerHTML = [...'일월화수목금토'].map(d => `<span class="py-2">${d}</span>`).join('');
    let cells = '<span></span><span></span>';
    for (let d = 1; d <= 31; d++) {
      const dots = Object.keys(spans).filter(k => d >= spans[k][0] && d <= spans[k][1]).map(k => `<i class="h-1 w-1 rounded-full" style="background:${colors[k]}"></i>`).join('');
      const today = d === 3;
      cells += `<a href="calendar.html" class="flex h-12 flex-col items-center justify-center gap-1 rounded-xl hover:bg-surface-2" aria-label="12월 ${d}일${today ? ' 오늘' : ''}">
        <span class="flex h-7 w-7 items-center justify-center rounded-full text-sm ${today ? 'bg-info font-bold text-white' : 'text-body'}">${d}</span>
        <span class="flex h-1 gap-0.5">${dots}</span></a>`;
    }
    $('[data-mini-cal]').innerHTML = cells;
    $('[data-mini-legend]').innerHTML = D.records.filter(r => spans[r.id]).map(r =>
      `<li class="flex items-center gap-2"><i class="h-2 w-2 flex-none rounded-full" style="background:${colors[r.id]}"></i>${esc(r.title)} · ${r.start.replace('월 ', '/').replace('일', '')}~${r.end.replace('월 ', '/').replace('일', '')}</li>`).join('');

    $('[data-ideas]').innerHTML = ['i1', 'i2', 'i3'].map(id => ideaCard(D.ideas.find(i => i.id === id), { compact: true })).join('');
    App.hydrateIcons();
  </script>
</body>
</html>
