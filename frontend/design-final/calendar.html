<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>달력 · trylog</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-nav="calendar">
  <header data-topbar></header>

  <main class="page">
    <div class="container-main">
      <div class="flex items-center justify-between">
        <div><h1 class="page-title">달력</h1><p class="page-desc">바꾼 내용을 기록하고, 결과 확인일에 전후를 비교해요.</p></div>
        <a href="ai.html?start=record" class="btn btn-xl btn-primary">새 기록 작성하기</a>
      </div>

      <div class="mt-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <label class="relative flex items-center">
            <span class="sr-only">월 선택</span>
            <select class="cursor-pointer appearance-none bg-transparent pr-7 text-[20px] font-bold focus:outline-none" data-month aria-live="polite"></select>
            <span class="pointer-events-none absolute right-0 text-heading" data-icon="chevron-down" data-size="20"></span>
          </label>
          <button type="button" class="rounded-lg bg-surface px-2.5 py-1 text-[13px] font-medium text-body hover:bg-[#e5e7eb]" data-today>오늘 날짜로 이동</button>
        </div>
        <div class="flex items-center gap-4 text-[13px] font-medium text-sub">
          <span class="flex items-center gap-1.5"><i class="h-2 w-2 rounded-full border border-dim"></i>진행 기간</span>
          <span class="flex items-center gap-1.5"><i class="h-2 w-2 rounded-full bg-brand"></i>결과 확인</span>
        </div>
      </div>

      <div class="mt-5 overflow-x-auto">
        <div class="min-w-[760px] overflow-hidden rounded-2xl border border-line">
          <div class="grid grid-cols-7 bg-surface-2 text-[13px] font-medium text-sub" data-weekdays></div>
          <div data-grid></div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/ai-chat.js"></script>
  <script>
    const { $, $$, icon, esc, won } = App;
    const D = TRYLOG;
    // 기록별 [시작, 종료, 결과 확인일, 색]
    const spans = { r1: ['2026-11-19', '2026-12-02', '2026-12-03', '#155dfc'], r2: ['2026-11-24', '2026-12-07', '2026-12-08', '#0092b8'],
      r3: ['2026-11-30', '2026-12-13', '2026-12-14', '#8e51ff'], r4: ['2026-12-08', '2026-12-21', '2026-12-22', '#e17100'],
      r5: ['2026-10-06', '2026-11-02', '2026-11-03', '#00a63e'], r6: ['2026-10-13', '2026-10-26', null, '#6a7282'] };
    const short = { r1: '떡볶이', r2: '점심', r3: '배달', r4: '포장', r5: '리뷰', r6: '저녁' };
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const TODAY = D.today;
    let view = new Date(2026, 11, 1);

    // 판매 자료가 있는 날(오늘까지)의 매출 · 날씨 — 목업용 고정값
    const seed = d => { const n = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate(); return (Math.sin(n) + 1) / 2; };
    const sales = d => 980000 + Math.round(seed(d) * 520) * 500 + (d.getDay() % 6 === 0 ? 180000 : 0);
    const weather = d => ['sun', 'sun', 'cloud', 'rain'][Math.floor(seed(new Date(+d + 7e6)) * 4)];
    const WEATHER_LABEL = { sun: '맑음', cloud: '흐림', rain: '비' };

    $('[data-weekdays]').innerHTML = [...'일월화수목금토'].map(w => `<span class="px-3 py-3">${w}</span>`).join('');
    const months = []; for (let m = 9; m <= 14; m++) months.push(new Date(2026, m, 1));
    $('[data-month]').innerHTML = months.map(m => `<option value="${m.getFullYear()}-${m.getMonth()}">${m.getFullYear()}년 ${m.getMonth() + 1}월</option>`).join('');

    function render() {
      $('[data-month]').value = `${view.getFullYear()}-${view.getMonth()}`;
      const first = new Date(view.getFullYear(), view.getMonth(), 1);
      const start = new Date(first); start.setDate(1 - first.getDay());
      const weeks = Math.ceil((first.getDay() + new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate()) / 7);
      let html = '';
      for (let w = 0; w < weeks; w++) {
        const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(start.getDate() + w * 7 + i); return d; });
        const keys = days.map(ymd), k0 = keys[0], k6 = keys[6];
        // 날짜 · 날씨
        const head = days.map((d, i) => {
          const key = keys[i], inMonth = d.getMonth() === view.getMonth(), isToday = key === TODAY, past = key <= TODAY;
          const wx = weather(d);
          return `<div class="flex items-center justify-between px-3 pt-2.5 ${i ? 'border-l border-line-light' : ''} ${inMonth ? '' : 'bg-surface-2/60'}">
            <span class="inline-flex h-7 min-w-[28px] items-center justify-center rounded-full px-1 text-[13px] font-medium ${isToday ? 'bg-brand font-semibold text-white' : inMonth ? 'text-body' : 'text-muted'}" ${isToday ? 'aria-label="오늘"' : ''}>${d.getDate()}</span>
            ${past || key <= '2026-12-10' ? `<span class="text-dim" title="${WEATHER_LABEL[wx]}" aria-label="날씨 ${WEATHER_LABEL[wx]}">${icon(wx, 16)}</span>` : ''}</div>`;
        }).join('');
        // 진행 기간 막대 + 결과 확인 알약 (한 줄씩 쌓음)
        const lanes = [];
        D.records.forEach(r => {
          const s = spans[r.id]; if (!s) return;
          if (s[0] <= k6 && s[1] >= k0) {
            const a = Math.max(0, keys.findIndex(k => k >= s[0])), b = keys.findLastIndex(k => k <= s[1]);
            const cont = s[0] < k0;
            lanes.push(`<a href="record.html?id=${r.id}" class="mx-1 flex h-6 items-center gap-1.5 truncate px-2 text-[13px] font-medium text-body hover:brightness-95 ${cont ? 'rounded-r-md' : 'rounded-md'}"
              style="grid-column:${a + 1} / ${b + 2};background:${s[3]}14" title="${esc(r.title)} · ${s[0].slice(5).replace('-', '/')}~${s[1].slice(5).replace('-', '/')}">
              <i class="h-1.5 w-1.5 flex-none rounded-full" style="background:${s[3]}"></i>${esc(r.title)}${cont ? ' <span class="text-sub">(이어짐)</span>' : ''}</a>`);
          }
          const ri = s[2] ? keys.indexOf(s[2]) : -1;
          if (ri > -1) lanes.push(`<a href="${r.status === 'check' ? 'result.html' : 'record.html?id=' + r.id}" class="mx-1 flex h-6 items-center gap-1 truncate rounded-md px-2 text-[13px] font-semibold text-white hover:brightness-95"
              style="grid-column:${ri + 1} / ${ri + 2};background:${s[3]}">${icon('check', 14)} 결과 확인 · ${short[r.id]}</a>`);
        });
        // 매출
        const foot = days.map((d, i) => {
          const key = keys[i], has = key <= TODAY && key >= '2026-10-01';
          return `<div class="flex items-center justify-between px-3 py-2 text-[13px] ${i ? 'border-l border-line-light' : ''} ${d.getMonth() === view.getMonth() ? '' : 'bg-surface-2/60'}">
            ${has ? `<span class="text-sub">매출</span><span class="font-semibold text-brand-strong">${won(sales(d))}원</span>` : '<span class="text-muted">—</span>'}</div>`;
        }).join('');
        html += `<div class="border-t border-line-light">
          <div class="grid grid-cols-7">${head}</div>
          <div class="relative min-h-[84px]">
            <div class="pointer-events-none absolute inset-0 grid grid-cols-7">${days.map((d, i) => `<span class="${i ? 'border-l border-line-light' : ''} ${d.getMonth() === view.getMonth() ? '' : 'bg-surface-2/60'}"></span>`).join('')}</div>
            <div class="relative grid grid-cols-7 gap-y-1 py-2">${lanes.join('')}</div>
          </div>
          <div class="grid grid-cols-7 border-t border-dashed border-line-light">${foot}</div></div>`;
      }
      $('[data-grid]').innerHTML = html;
    }
    $('[data-month]').addEventListener('change', e => { const [y, m] = e.target.value.split('-'); view = new Date(+y, +m, 1); render(); });
    $('[data-today]').addEventListener('click', () => { view = new Date(2026, 11, 1); render(); });
    render();
    App.hydrateIcons();
  </script>
</body>
</html>
