<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 가게 · trylog</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-nav="store">
  <header data-topbar></header>

  <main class="page">
    <div class="container-main">
      <h1 class="page-title">내 가게</h1>
      <div class="mt-8 flex gap-6" role="tablist" aria-label="내 가게 메뉴">
        <button type="button" role="tab" class="text-[20px] font-bold" data-tab="info">가게 정보</button>
        <button type="button" role="tab" class="text-[20px] font-bold" data-tab="data">판매 자료 관리</button>
      </div>

      <!-- ST-01 가게 정보 -->
      <form class="mt-8 max-w-[760px] rounded-card border border-line-light bg-white p-8" novalidate data-panel="info">
        <div><label class="label" for="st-name">가게 이름<span class="req">*</span></label><input class="input" id="st-name" required></div>
        <div class="mt-6"><label class="label" for="st-addr">주소<span class="req">*</span></label>
          <div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sub" data-icon="search"></span><input class="input pl-9" id="st-addr" required></div></div>
        <div class="mt-6"><label class="label" for="st-menu">대표 메뉴</label><input class="input" id="st-menu" placeholder="예: 떡볶이, 김밥"></div>
        <fieldset class="mt-6"><legend class="label text-sm">업종</legend>
          <div class="flex flex-wrap gap-2" data-chip-group="single"></div></fieldset>
        <fieldset class="mt-6"><legend class="label text-sm">판매 방식</legend>
          <div class="flex flex-wrap gap-2" data-chip-group="multi"></div></fieldset>
        <div class="mt-6"><label class="label" for="st-hours">영업시간</label><input class="input" id="st-hours" value="11:00 ~ 21:00"></div>
        <p class="field-error" data-error hidden></p>
        <div class="mt-8 flex justify-end"><button class="btn btn-lg btn-primary">저장</button></div>
      </form>

      <!-- ST-02 판매 자료 관리 -->
      <section class="mt-8" data-panel="data" hidden>
        <div class="flex items-center justify-between">
          <p class="text-base text-sub">올린 판매 자료와 결과 · 예상매출에 쓰이는 범위를 확인해요.</p>
          <a href="upload.html" class="btn btn-lg btn-primary">판매 자료 추가</a>
        </div>
        <div class="mt-6 grid grid-cols-3 gap-4">
          <div class="card p-5"><p class="text-[13px] font-medium text-sub">저장한 일별 매출</p><p class="mt-1.5 text-base font-semibold">92일</p><p class="mt-1.5 text-[13px] font-medium text-sub">10월 1일 ~ 12월 3일</p></div>
          <div class="card p-5"><p class="text-[13px] font-medium text-sub">올린 자료</p><p class="mt-1.5 text-base font-semibold" data-upload-count></p><p class="mt-1.5 text-[13px] font-medium text-sub" data-upload-kinds></p></div>
          <div class="card p-5"><p class="text-[13px] font-medium text-sub">이 자료를 쓰는 곳</p><p class="mt-1.5 text-base font-semibold">결과 1 · 예상매출</p><p class="mt-1.5 text-[13px] font-medium text-sub">떡볶이 세트 가격 변경</p></div>
        </div>
        <table class="table mt-6">
          <thead><tr><th class="w-[140px]">올린 날</th><th class="w-[260px]">자료</th><th class="w-[220px]">구간</th><th>항목</th><th class="w-[120px]"><span class="sr-only">관리</span></th></tr></thead>
          <tbody data-rows></tbody>
        </table>
        <p class="mt-4 rounded-xl bg-surface-2 px-5 py-3 text-sm font-semibold text-sub">자료를 지우면 그 자료를 쓴 결과(떡볶이 세트 가격 변경)와 예상매출을 다시 계산해요.</p>
      </section>
    </div>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const { $, $$, esc, params, toast, openModal } = App;
    const D = TRYLOG, S = D.store;
    $('#st-name').value = S.name; $('#st-addr').value = S.address; $('#st-menu').value = S.menu;
    $$('[data-chip-group]')[0].innerHTML = ['한식', '중식', '일식', '양식', '분식', '카페·디저트', '주점', '치킨·패스트푸드', '기타'].map(t => `<button type="button" class="chip" aria-pressed="${t === S.type}">${t}</button>`).join('');
    $$('[data-chip-group]')[1].innerHTML = ['매장 식사', '포장', '배달'].map(t => `<button type="button" class="chip" aria-pressed="${S.modes.includes(t)}">${t}</button>`).join('');

    function tab(k) {
      $$('[data-tab]').forEach(t => { const on = t.dataset.tab === k; t.setAttribute('aria-selected', on); t.className = `text-[20px] ${on ? 'font-bold text-brand' : 'font-medium text-dim hover:text-sub'}`; });
      $$('[data-panel]').forEach(p => (p.hidden = p.dataset.panel !== k));
      history.replaceState(null, '', k === 'data' ? 'store.html?tab=data' : 'store.html');
    }
    $$('[data-tab]').forEach(t => t.addEventListener('click', () => tab(t.dataset.tab)));
    tab(params.get('tab') === 'data' ? 'data' : 'info');

    $('[data-panel="info"]').addEventListener('submit', e => {
      e.preventDefault();
      const bad = ['#st-name', '#st-addr'].map(s => $(s)).filter(i => !i.value.trim());
      ['#st-name', '#st-addr'].forEach(s => $(s).setAttribute('aria-invalid', String(bad.includes($(s)))));
      $('[data-error]').hidden = !bad.length; $('[data-error]').textContent = '가게 이름과 주소를 입력해 주세요.';
      if (!bad.length) toast('가게 정보를 저장했어요.');
    });

    const rows = [...D.uploads];
    function renderRows() {
      $('[data-rows]').innerHTML = rows.map((u, i) => `<tr class="cursor-default hover:bg-white">
        <td class="font-semibold text-heading">${u.date}</td><td class="font-semibold text-heading">${esc(u.file)}${u.kind ? ` · ${u.kind}` : ''}</td>
        <td class="font-semibold text-heading">${u.range}</td><td class="font-semibold text-heading">${u.items}</td>
        <td class="text-right"><button type="button" class="px-1.5 text-sm font-semibold text-sub hover:text-heading" data-view="${i}">보기</button>
          <button type="button" class="px-1.5 text-sm font-semibold text-sub hover:text-danger" data-del="${i}">삭제</button></td></tr>`).join('')
        || '<tr class="cursor-default"><td colspan="5" class="py-10 text-center text-sub">올린 판매 자료가 없어요.</td></tr>';
      $('[data-upload-count]').textContent = `${rows.length}건`;
      const k = n => rows.filter(u => (u.kind || '직접 입력') === n).length;
      $('[data-upload-kinds]').textContent = `사진 ${k('사진')} · 엑셀 ${k('엑셀')} · 직접 입력 ${k('직접 입력')}`;
    }
    $('[data-rows]').addEventListener('click', e => {
      const v = e.target.closest('[data-view]'), d = e.target.closest('[data-del]');
      if (v) location.href = rows[+v.dataset.view].kind === '사진' ? 'confirm.html' : 'result.html';
      if (d) { const u = rows[+d.dataset.del]; openModal({ title: '이 판매 자료를 삭제할까요?', tone: 'danger', confirm: '삭제하기',
        body: `<b class="font-semibold text-heading">${esc(u.file)}</b> (${u.range})을 지우면 이 자료를 쓴 결과와 예상매출을 다시 계산해요.`,
        onConfirm: () => { rows.splice(+d.dataset.del, 1); renderRows(); toast('판매 자료를 삭제했어요.'); } }); }
    });
    renderRows();
    App.hydrateIcons();
  </script>
</body>
</html>
