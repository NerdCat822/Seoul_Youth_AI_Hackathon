  <script>

    const pick = ids => ids.map(id => ideaCard(TRYLOG.ideas.find(i => i.id === id))).join('');
    $('[data-today]').innerHTML = pick(['i6', 'i4', 'i5']);
    $('[data-free]').innerHTML = pick(['i1', 'i7', 'i3']);
