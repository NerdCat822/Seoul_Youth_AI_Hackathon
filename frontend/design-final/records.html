<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 기록 · trylog</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-nav="records">
  <header data-topbar></header>

  <main class="page">
    <div class="container-main">
      <div class="flex items-center justify-between">
        <div><h1 class="page-title">내 기록</h1><p class="page-desc">바꾼 내용을 기록하고, 결과 확인일에 전후를 비교해요.</p></div>
        <a href="ai.html?start=record" class="btn btn-xl btn-primary">새 기록 작성하기</a>
      </div>

      <div class="mt-10 flex items-center justify-between gap-4">
        <div class="flex flex-wrap gap-1" role="tablist" aria-label="상태" data-status-tabs></div>
        <div class="seg flex-none" role="group" aria-label="보기 방식" data-view-toggle>
          <button type="button" class="inline-flex items-center gap-1.5" data-view="list" aria-pressed="true"><span data-icon="list" data-size="16"></span>목록</button>
          <button type="button" class="inline-flex items-center gap-1.5" data-view="card" aria-pressed="false"><span data-icon="grid" data-size="16"></span>카드</button>
        </div>
      </div>

      <div class="mt-5 overflow-x-auto">      <table class="table min-w-[860px]" data-table>
        <thead><tr><th class="w-[328px]">기록명</th><th class="w-[140px]">상태</th><th class="w-[140px]">시작일</th><th class="w-[140px]">종료일</th><th class="w-[170px]">결과 확인일</th><th>비교 항목</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="mt-5 grid grid-cols-3 gap-5" data-cards hidden></div>
      <p class="mt-5 rounded-card bg-surface-2 py-14 text-center text-base text-sub" data-empty hidden>이 상태의 기록이 없어요.</p>
    </div>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/ai-chat.js"></script>
  <script>
    const { $, esc, params, badge } = App;
    const D = TRYLOG;
    const order = ['all', 'check', 'progress', 'planned', 'data', 'done', 'stopped'];
    let cur = order.includes(params.get('status')) ? params.get('status') : 'all';
    const href = r => r.status === 'done' ? 'result.html' : `record.html?id=${r.id}`;
    // 보기 방식: ?view=card > 마지막으로 고른 방식 > 목록
    let view = params.get('view') || (() => { try { return localStorage.getItem('trylog.recordsView'); } catch (e) { return null; } })() || 'list';
    if (!['list', 'card'].includes(view)) view = 'list';

    // 카드 아래쪽 안내 (상태별)
    function footer(r) {
      const link = (t, cls = 'text-brand-text') => `<span class="inline-flex items-center text-sm font-semibold ${cls}">${t}${App.icon('chevron-right', 16)}</span>`;
      if (r.status === 'check') return `<p class="text-sm font-medium text-danger">${esc(r.warn)}</p>${link('결과 확인하기')}`;
      if (r.status === 'progress') return `<p class="text-sm text-sub">결과 확인까지 <b class="font-semibold text-brand">${r.resultNote.replace('D-', '')}일</b> 남았어요</p>${link('기록 보기', 'text-sub')}`;
      if (r.status === 'planned') return `<p class="text-sm text-sub">${r.start}에 시작해요</p>${link('기록 보기', 'text-sub')}`;
      if (r.status === 'done') return `<p class="text-sm text-sub">${r.result}에 결과를 확인했어요</p>${link('결과 보기')}`;
      return `<p class="text-sm text-sub">중단한 기록이에요</p>${link('기록 보기', 'text-sub')}`;
    }
    const card = r => {
      const hot = r.status === 'check';
      return `<a href="${href(r)}" class="flex flex-col rounded-card bg-white p-5 transition-shadow hover:shadow-panel ${hot ? 'border-2 border-brand/60 p-[19px] shadow-panel' : 'border border-line-light'} ${r.status === 'stopped' ? 'opacity-70' : ''}">
        <div class="flex items-start justify-between gap-3"><h2 class="text-[18px] font-semibold leading-7">${esc(r.title)}</h2><span class="flex-none pt-0.5">${badge(r.status)}</span></div>
        <dl class="mt-4 grid grid-cols-2 gap-x-4 gap-y-3">
          <div><dt class="text-[13px] text-sub">시작일</dt><dd class="mt-1 text-sm font-medium text-body">${r.start}</dd></div>
          <div><dt class="text-[13px] text-sub">종료일</dt><dd class="mt-1 text-sm font-medium text-body">${r.end}</dd></div>
          <div><dt class="text-[13px] text-sub">결과 확인일</dt><dd class="mt-1 text-sm font-medium text-body">${r.result}${hot ? ' <span class="text-[13px] font-semibold text-brand">오늘</span>' : ''}</dd></div>
          <div class="min-w-0"><dt class="text-[13px] text-sub">비교 항목</dt><dd class="mt-1 truncate text-sm font-medium text-body" title="${esc(r.compare)}">${esc(r.compareShort || r.compare)}</dd></div>
        </dl>
        <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-surface" role="progressbar" aria-label="진행률" aria-valuenow="${r.progress}" aria-valuemin="0" aria-valuemax="100">
          <div class="h-full rounded-full ${r.status === 'stopped' ? 'bg-dim' : 'bg-brand'}" style="width:${r.progress}%"></div></div>
        <div class="mt-auto flex items-center justify-between gap-3 pt-4">${footer(r)}</div>
      </a>`;
    };

    function render() {
      $('[data-status-tabs]').innerHTML = order.map(s => {
        const n = s === 'all' ? D.records.length : D.records.filter(r => r.status === s).length;
        return `<button type="button" role="tab" class="filter-tab" aria-selected="${cur === s}" data-s="${s}">${s === 'all' ? '전체' : D.statusLabel[s]} <span class="count">${n}</span></button>`;
      }).join('');
      const rows = D.records.filter(r => cur === 'all' || r.status === cur);
      $('[data-table] tbody').innerHTML = rows.map(r => `<tr data-href="${href(r)}" tabindex="0">
        <td class="text-[15px] font-semibold text-heading">${esc(r.title)}</td><td>${badge(r.status)}</td>
        <td>${r.start}</td><td>${r.end}</td><td>${r.result}${r.resultNote ? ` (${r.resultNote})` : ''}</td><td>${esc(r.compareShort || r.compare)}</td></tr>`).join('');
      $('[data-cards]').innerHTML = rows.map(card).join('');
      $('[data-table]').hidden = !rows.length || view !== 'list';
      $('[data-cards]').hidden = !rows.length || view !== 'card';
      $('[data-empty]').hidden = !!rows.length;
      App.$$('[data-view]').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.view === view)); b.setAttribute('aria-selected', String(b.dataset.view === view)); });
      const q = new URLSearchParams(); if (cur !== 'all') q.set('status', cur); if (view === 'card') q.set('view', 'card');
      history.replaceState(null, '', 'records.html' + (q.toString() ? '?' + q : ''));
    }
    $('[data-status-tabs]').addEventListener('click', e => { const t = e.target.closest('[data-s]'); if (t) { cur = t.dataset.s; render(); } });
    const open = e => { const tr = e.target.closest('tr[data-href]'); if (tr) location.href = tr.dataset.href; };
    $('[data-table]').addEventListener('click', open);
    $('[data-table]').addEventListener('keydown', e => { if (e.key === 'Enter') open(e); });
    $('[data-view-toggle]').addEventListener('click', e => {
      const b = e.target.closest('[data-view]'); if (!b) return;
      view = b.dataset.view; try { localStorage.setItem('trylog.recordsView', view); } catch (err) {}
      render();
    });
    App.hydrateIcons();
    render();
  </script>
</body>
</html>
