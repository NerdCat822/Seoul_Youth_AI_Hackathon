<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · trylog</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header data-topbar="minimal"></header>

  <main class="flex justify-center px-6 pb-16 pt-8">
    <div class="w-[560px] rounded-panel border border-line-light bg-white p-8 shadow-panel">
      <ol class="stepper" data-stepper aria-label="가입 단계">
        <li class="step" data-step-dot="1"><span class="num">1</span>계정 정보 입력</li><li class="bar" aria-hidden="true"></li>
        <li class="step" data-step-dot="2"><span class="num">2</span>가게 정보 입력</li><li class="bar" aria-hidden="true"></li>
        <li class="step" data-step-dot="3"><span class="num">3</span>가입 완료</li>
      </ol>

      <!-- STEP 1 · 계정 정보 -->
      <form data-step="1" novalidate>
        <h1 class="mt-10 text-2xl font-bold">계정 정보를 알려주세요</h1>
        <p class="mt-2 text-sm text-sub">맞춤 사례와 결과 비교에 사용해요. 나중에 설정에서 언제든 바꿀 수 있어요.</p>
        <div class="mt-8"><label class="label" for="s-id">아이디<span class="req">*</span></label>
          <input class="input" id="s-id" required autocomplete="username" placeholder="영문, 숫자 4~20자"></div>
        <div class="mt-5"><label class="label" for="s-pw">비밀번호<span class="req">*</span></label>
          <input class="input" id="s-pw" type="password" required minlength="8" autocomplete="new-password" placeholder="8자 이상">
          <p class="field-error" data-error hidden></p></div>
        <div class="mt-8 flex justify-between">
          <a href="login.html" class="btn btn-lg btn-neutral">이전</a>
          <button class="btn btn-lg btn-primary" type="submit">다음</button>
        </div>
      </form>

      <!-- STEP 2 · 가게 정보 -->
      <form data-step="2" novalidate hidden>
        <h1 class="mt-10 text-2xl font-bold">가게 정보를 알려 주세요</h1>
        <p class="mt-2 text-sm text-sub">맞춤 사례와 결과 비교에 사용해요. 나중에 설정에서 언제든 바꿀 수 있어요.</p>
        <div class="mt-8"><label class="label" for="s-name">가게 이름<span class="req">*</span></label>
          <input class="input" id="s-name" required placeholder="가게 이름 입력"></div>
        <div class="mt-5"><label class="label" for="s-addr">주소<span class="req">*</span></label>
          <div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sub" data-icon="search"></span>
            <input class="input pl-9" id="s-addr" required placeholder="주소 입력"></div></div>
        <div class="mt-5"><label class="label" for="s-menu">대표 메뉴</label>
          <input class="input" id="s-menu" placeholder="예: 떡볶이, 김밥"></div>
        <fieldset class="mt-5"><legend class="label text-sm">업종</legend>
          <div class="flex flex-wrap gap-2" data-chip-group="single">
            <button type="button" class="chip" aria-pressed="false">한식</button><button type="button" class="chip" aria-pressed="false">중식</button>
            <button type="button" class="chip" aria-pressed="false">일식</button><button type="button" class="chip" aria-pressed="false">양식</button>
            <button type="button" class="chip" aria-pressed="true">분식</button><button type="button" class="chip" aria-pressed="false">카페·디저트</button>
            <button type="button" class="chip" aria-pressed="false">주점</button><button type="button" class="chip" aria-pressed="false">치킨·패스트푸드</button>
            <button type="button" class="chip" aria-pressed="false">기타</button>
          </div></fieldset>
        <fieldset class="mt-5"><legend class="label text-sm">판매 방식</legend>
          <div class="flex flex-wrap gap-2" data-chip-group="multi">
            <button type="button" class="chip" aria-pressed="true">매장 식사</button><button type="button" class="chip" aria-pressed="true">포장</button>
            <button type="button" class="chip" aria-pressed="false">배달</button>
          </div></fieldset>
        <div class="mt-5"><label class="label" for="s-hours">영업시간</label>
          <input class="input" id="s-hours" placeholder="예: 11:00 ~ 21:00"></div>
        <p class="field-error" data-error hidden></p>
        <div class="mt-8 flex justify-between">
          <button type="button" class="btn btn-lg btn-neutral" data-back>돌아가기</button>
          <button class="btn btn-lg btn-primary" type="submit">시작하기</button>
        </div>
      </form>

      <!-- STEP 3 · 완료 -->
      <section data-step="3" hidden>
        <h1 class="mt-10 text-2xl font-bold">회원 가입 완료!</h1>
        <p class="mt-2 text-sm text-sub">이제 바꾼 일을 기록하고, 결과를 확인해 보세요.</p>
        <div class="mt-6 flex h-[248px] flex-col items-center justify-center gap-3 rounded-2xl bg-brand-weak text-brand">
          <span data-icon="checkbox-circle" data-size="56"></span>
          <p class="text-base font-semibold text-brand-text" data-welcome></p>
        </div>
        <a href="home-guest.html?toast=가입을 환영해요!" class="btn btn-lg btn-primary mt-6 w-full">시작하기</a>
      </section>
    </div>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const { $, $$, icon } = App;
    App.hydrateIcons();
    function go(n) {
      $$('[data-step]').forEach(s => (s.hidden = s.dataset.step !== String(n)));
      $$('[data-step-dot]').forEach(d => {
        const k = +d.dataset.stepDot;
        d.classList.toggle('is-done', k < n); d.classList.toggle('is-current', k === n);
        $('.num', d).innerHTML = k < n ? icon('check', 14) : k;
      });
      const first = $(`[data-step="${n}"] input`); first && first.focus();
    }
    function check(form, msg) {
      const bad = $$('input[required]', form).filter(i => !i.value.trim() || (i.minLength > 0 && i.value.length < i.minLength));
      $$('input[required]', form).forEach(i => i.setAttribute('aria-invalid', String(bad.includes(i))));
      const err = $('[data-error]', form); err.hidden = !bad.length; err.textContent = bad.length ? msg : '';
      if (bad.length) bad[0].focus();
      return !bad.length;
    }
    $('[data-step="1"]').addEventListener('submit', e => { e.preventDefault(); if (check(e.target, '아이디와 8자 이상의 비밀번호를 입력해 주세요.')) go(2); });
    $('[data-step="2"]').addEventListener('submit', e => {
      e.preventDefault();
      if (!check(e.target, '가게 이름과 주소를 입력해 주세요.')) return;
      $('[data-welcome]').textContent = `${$('#s-name').value.trim()} 사장님, 반가워요`;
      go(3);
    });
    $('[data-back]').addEventListener('click', () => go(1));
    go(1);
  </script>
</body>
</html>
